<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisionBox — Gộp bản dịch</title>
<link rel="stylesheet" href="vb-extra.css">
</head>
<body>
<header class="vbs-top">
  <div><h1>VisionBox · Gộp bản dịch</h1><p class="vbs-hint">Hợp nhất hai bản dịch thành bản tốt nhất</p></div>
</header>
<nav class="vbs-nav"></nav>

<main class="vbs-main">
  <section class="vbs-card">
    <h2>1. Nạp 2 bản dịch</h2>
    <div class="vbs-grid2">
      <div class="vbs-field">
        <label>Bản A <span class="vbs-hint" id="m-info-a"></span></label>
        <div class="vbs-row">
          <label class="vbs-btn" for="m-file-a">Chọn file</label>
          <input type="file" id="m-file-a" accept=".txt,.md,.csv,.json,.docx" hidden>
          <button class="vbs-btn danger" id="m-clear-a">Xoá</button>
        </div>
        <textarea id="m-a" rows="12" placeholder="Dán bản dịch A…"></textarea>
      </div>
      <div class="vbs-field">
        <label>Bản B <span class="vbs-hint" id="m-info-b"></span></label>
        <div class="vbs-row">
          <label class="vbs-btn" for="m-file-b">Chọn file</label>
          <input type="file" id="m-file-b" accept=".txt,.md,.csv,.json,.docx" hidden>
          <button class="vbs-btn danger" id="m-clear-b">Xoá</button>
        </div>
        <textarea id="m-b" rows="12" placeholder="Dán bản dịch B…"></textarea>
      </div>
    </div>
  </section>

  <section class="vbs-card">
    <h2>2. Cấu hình gộp</h2>
    <div class="vbs-grid3">
      <div class="vbs-field"><label>Model</label><select id="m-model" data-model></select></div>
      <div class="vbs-field"><label>Ngôn ngữ đích</label><select id="m-dst"><option value="vi">Vietnamese</option><option value="en">English</option></select></div>
      <div class="vbs-field"><label>Bản chuẩn số dòng</label><select id="m-anchor"><option value="auto">Tự động</option><option value="a">Bản A</option><option value="b">Bản B</option></select></div>
      <div class="vbs-field"><label>Số dòng mỗi request</label><input type="number" id="m-chunk" min="10" step="10" value="60"></div>
      <div class="vbs-field"><label>Nghỉ giữa 2 request (ms)</label><input type="number" id="m-delay" min="0" step="100" value="700"></div>
    </div>
    <div class="vbs-row">
      <label class="vbs-inline"><input type="checkbox" id="m-dropsfx" checked> Loại bỏ SFX</label>
      <label class="vbs-inline"><input type="checkbox" id="m-keepnar" checked> Giữ narration</label>
      <label class="vbs-inline"><input type="checkbox" id="m-bi"> Xuất kèm dòng gốc</label>
      <label class="vbs-inline"><input type="checkbox" id="m-style" checked> Elements of Style</label>
      <label class="vbs-inline"><input type="checkbox" id="m-ctx" checked> Dùng ngữ cảnh đã lưu</label>
      <label class="vbs-inline"><input type="checkbox" id="m-offline"> Chế độ offline (không gọi API)</label>
    </div>
    <div class="vbs-row">
      <button class="vbs-btn primary" id="m-run">▶ Gộp</button>
      <button class="vbs-btn danger" id="m-stop" disabled>■ Dừng</button>
      <span class="vbs-sp"></span><span class="vbs-hint" id="m-status">Chưa nạp dữ liệu.</span>
    </div>
    <div class="vbs-progress"><div id="m-progress"></div></div>
  </section>

  <section class="vbs-card">
    <h2>3. Kết quả</h2>
    <div class="vbs-row">
      <button class="vbs-btn" id="m-copy">Copy</button>
      <button class="vbs-btn" id="m-txt">⬇ .txt</button>
      <button class="vbs-btn" id="m-docx">⬇ .docx</button>
      <button class="vbs-btn" id="m-zip">⬇ .zip</button>
      <span class="vbs-hint" id="m-stat"></span>
    </div>
    <textarea id="m-out" rows="20" placeholder="Bản gộp sẽ hiện ở đây…"></textarea>
  </section>
</main>

<script src="jszip.min.js"></script>
<script src="style-guide.js"></script>
<script src="vb-shared.js"></script>
<script src="vb-merge.js"></script>
</body>
</html>
